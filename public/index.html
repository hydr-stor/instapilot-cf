<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>InstaPilot AI</title>

<style>
:root{--bg:#f3f5fa;--c:#fff;--c2:#eef1f8;--b:#e2e6f0;--t:#0f1428;--m:#68708c;--p:#3b82f6;--p2:#2563eb;--ok:#15803d;--er:#e11d48;--wa:#b45309;--sh:0 8px 28px rgba(15,20,40,.07);--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:light}

*{box-sizing:border-box;font-family:Tajawal,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--t);overflow-x:hidden;min-height:100dvh}

.lg .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s .2s ease forwards}.lg .fl{opacity:0;animation:fi .6s 1.05s forwards}@keyframes dr{to{stroke-dashoffset:0}}
/* auth */

.f{margin-bottom:12px}.fi{display:flex;align-items:center;gap:10px;background:var(--c2);border:1.5px solid transparent;border-radius:14px;padding:0 14px;transition:.2s}.fi:focus-within{border-color:var(--p);background:var(--c)}
.fi input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--t);font-size:16px;padding:15px 0}.ico,.eye{color:var(--m);display:grid;place-items:center}.eye{background:none;border:0;padding:6px}
.f.bad .fi{border-color:var(--er);background:rgba(225,29,72,.07)}.fe{color:var(--er);font-size:13px;min-height:0;margin:5px 4px 0}.fe:empty{display:none}
.rw{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px;font-size:14px}.ck{display:flex;align-items:center;gap:9px;cursor:pointer}.ck input{display:none}.ck i{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--b);display:grid;place-items:center;color:#fff;transition:.2s}.ck input:checked+i{background:var(--p);border-color:var(--p)}

.pb i{display:none;width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;margin:auto}.pb.ld span{display:none}.pb.ld i{display:block}

@media(min-width:700px){.au{justify-content:center;align-items:center}.sheet{margin:0;border-radius:28px;width:440px;max-width:94vw}}
/* app */
.sd{display:none}.tp{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(10px + var(--sa)) 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b)}.tp h2{font-size:20px;font-weight:800}
.pill{font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;background:var(--c2);color:var(--m);display:inline-flex;align-items:center;gap:6px}.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.pill.ok{color:var(--ok)}.pill.er{color:var(--er)}.pill.wa{color:var(--wa)}
.mn{max-width:760px;margin:0 auto;padding-bottom:calc(96px + var(--sb))}#pg{padding:16px 16px 0}.pg>*{animation:up .45s both}.pg>*:nth-child(2){animation-delay:.05s}.pg>*:nth-child(3){animation-delay:.1s}.pg>*:nth-child(4){animation-delay:.15s}.pg>*:nth-child(5){animation-delay:.2s}

.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.m{color:var(--m);font-size:14px}.big{font-size:30px;font-weight:800}.ok{color:var(--ok)}.er{color:var(--er)}.wa{color:var(--wa)}
.sec{font-size:13px;font-weight:700;color:var(--m);margin:20px 6px 8px}.pg input:not([type=checkbox]),.pg textarea,.pg select{width:100%;padding:13px 14px;margin:5px 0 12px;border-radius:13px;border:1.5px solid var(--b);background:var(--c2);color:var(--t);font-size:16px;outline:0;transition:.2s}.pg input:focus,.pg textarea:focus{border-color:var(--p);background:var(--c)}
.bt2{border:0;background:var(--p);color:#fff;font-weight:700;font-size:15px;padding:12px 20px;border-radius:13px;transition:transform .15s}.bt2:active{transform:scale(.96)}.bt2.g{background:var(--c2);color:var(--t)}.bt2.d{background:rgba(225,29,72,.12);color:var(--er)}a.bt2{display:inline-block}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:var(--c2);color:var(--m)}.tag.ok{background:rgba(22,163,74,.13);color:var(--ok)}.tag.er{background:rgba(225,29,72,.12);color:var(--er)}.tag.wa{background:rgba(217,119,6,.14);color:var(--wa)}
.bar{height:8px;border-radius:8px;background:var(--c2);overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:8px;background:var(--p);transition:width 1s}
.sw{position:relative;width:56px;height:32px;border-radius:20px;background:var(--b);cursor:pointer;transition:.25s;flex:none;border:0}.sw:after{content:"";position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.25s}.sw.on{background:var(--p)}.sw.on:after{right:27px}
.chip{display:inline-block;padding:8px 15px;margin:0 0 8px 8px;border-radius:30px;border:1.5px solid var(--b);background:var(--c);cursor:pointer;font-size:14px;transition:.2s}.chip.on{border-color:var(--p);color:var(--p);background:color-mix(in srgb,var(--p) 10%,transparent)}
.bub{padding:10px 14px;border-radius:18px;margin:6px 0;max-width:88%;line-height:1.7;word-break:break-word;animation:up .35s both}.bu{background:var(--c2);border-top-right-radius:5px}.ba{background:var(--p);color:#fff;margin-right:auto;border-top-left-radius:5px}
.li{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--b);cursor:pointer}.li:last-child{border:0}.li .ico{width:38px;height:38px;border-radius:12px;background:var(--c2);display:grid;place-items:center;color:var(--p);flex:none}.li>div{flex:1;min-width:0}.tr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot,.li>.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--b);display:grid;place-items:center;flex:none;color:#fff}.s3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}.s3 .card{margin:0;padding:14px}.s3 .big{font-size:26px}.dot.d{background:var(--ok);border-color:var(--ok)}
.emp{text-align:center;padding:34px 10px;color:var(--m)}.emp .ico{width:60px;height:60px;border-radius:20px;background:var(--c2);display:grid;place-items:center;margin:0 auto 12px;color:var(--p)}
.sk{height:84px;border-radius:20px;margin-bottom:14px;background:linear-gradient(90deg,var(--c2) 25%,var(--c) 50%,var(--c2) 75%);background-size:200% 100%;animation:sh 1.3s linear infinite}
.bn{position:fixed;inset:auto 0 0;z-index:6;display:flex;background:color-mix(in srgb,var(--c) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--b);padding:6px 6px calc(6px + var(--sb))}
.bn a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--m);font-size:11px;font-weight:500;padding:6px 0;border-radius:12px;transition:.2s}.bn a.on{color:var(--p)}.bn a:active{transform:scale(.9)}
.toast{position:fixed;top:calc(14px + var(--sa));left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:30px;background:var(--t);color:var(--bg);font-weight:700;box-shadow:var(--sh);z-index:99;animation:up .3s;max-width:92vw}.toast.er{background:var(--er);color:#fff}
table{width:100%;border-collapse:collapse}td{padding:10px 6px;border-bottom:1px solid var(--b);font-size:14px}
@media(min-width:900px){.bn{display:none}.sd{display:flex;flex-direction:column;gap:4px;position:fixed;inset:0 0 0 auto;width:250px;padding:calc(20px + var(--sa)) 14px 20px;background:var(--c);border-left:1px solid var(--b)}.mn{margin-right:250px;max-width:none;padding-bottom:40px}#pg{max-width:900px;margin:0 auto;padding:24px}
.sd .nb{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:13px;color:var(--t);transition:.2s}.sd .nb:hover{background:var(--c2)}.sd .nb.on{background:color-mix(in srgb,var(--p) 12%,transparent);color:var(--p);font-weight:700}.sd .lo{display:flex;align-items:center;gap:10px;padding:8px 10px 18px}.sd .lo b{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-delay:0s!important;transition:none!important}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');let me=null,mode='in',step=1,pend=null,flt='all',q='';
const I={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',store:'<path d="M6 7h12l1 13H5zM9 7a3 3 0 0 1 6 0"/>',bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13v2M15 13v2"/>',ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/>',card:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 7l9 6 9-6"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.9C3.7 8.7 2 12 2 12s4 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',check:'<path d="M5 12l5 5 9-10"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',tag:'<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1"/>',inbox:'<path d="M3 13l3-8h12l3 8v6H3zM3 13h5l1 3h6l1-3h5"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const logo=(s,a,id)=>`<svg class="lg" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><path class="${a?'fl':''}" d="M22 2L15 22l-4-9-9-4z" fill="url(#g${id})"/><path class="${a?'dr':''}" pathLength="1" d="M22 2L15 22l-4-9-9-4z" stroke="#e8f1ff" stroke-width="1" stroke-linejoin="round"/><path d="M22 2L11 13" stroke="#e8f1ff" stroke-width="1" stroke-linecap="round"/></svg>`;
const api=async(p,m='GET',b)=>{const r=await fetch('/api/'+p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'خطأ');return j};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(t,k='')=>{const e=document.createElement('div');e.className='toast '+k;e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)};
const ST={sent:['أُرسل','ok'],escalated:['محوّل لصاحب المتجر','wa'],error:['خطأ','er'],ai_off:['الرد متوقف',''],not_configured:['التكامل غير مفعّل',''],limit_reached:['تجاوز الحد','er'],pending:['قيد المعالجة','']};
function splash(){if(sessionStorage.sp||matchMedia('(prefers-reduced-motion:reduce)').matches)return;sessionStorage.sp=1;const d=document.createElement('div');d.id='sp';d.innerHTML=`<div class="sg"></div><div class="sc">${logo(96,1,'s')}<div class="sn serif">InstaPilot <b>AI</b></div><div class="st">ردود ذكية على رسائل متجرك</div></div>`;document.body.append(d);setTimeout(()=>d.classList.add('out'),2500);setTimeout(()=>d.remove(),3150)}
/* ---------- auth ---------- */
const setErr=(el,m)=>{const f=el.closest('.f');f.classList.toggle('bad',!!m);f.querySelector('.fe').textContent=m||''};
const chk=(f,R)=>R.map(([n,fn,m])=>{const el=f.elements[n],v=el.value.trim?el.value.trim():el.value,bad=!fn(v);setErr(el,bad?m:'');return !bad}).every(Boolean);
const rEmail=['email',v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v),'أدخل بريداً إلكترونياً صحيحاً'];
const fld=(n,t,i,ph)=>`<div class="f"><div class="fi"><span class="ico">${ic(i,19)}</span><input name="${n}" type="${t}" placeholder="${ph}" autocomplete="${t=='password'?(mode=='in'?'current-password':'new-password'):n=='email'?'email':n=='code'?'one-time-code':'off'}" ${t=='email'?'inputmode="email" autocapitalize="none" autocorrect="off"':''}${n=='code'?' inputmode="numeric" maxlength="6"':''}>${t=='password'?`<button type="button" class="eye" aria-label="إظهار/إخفاء كلمة المرور">${ic('eye',19)}</button>`:''}</div><div class="fe"></div></div>`;
const busy=(b,on)=>{b.classList.toggle('ld',on);b.disabled=on};
function authView(){A.dataset.v='auth';const up=mode=='up',fg=mode=='fg',cd=step==2;
const T=fg?[cd?'أدخل الرمز':'استعادة كلمة المرور.','سنرسل رمزاً إلى بريدك لتعيين كلمة مرور جديدة']:up?[cd?'تحقق من بريدك.':'ابدأ مجاناً.',cd?'أرسلنا رمزاً من 6 أرقام إلى '+esc(pend):'أنشئ حساب متجرك وفعّل الرد الذكي بدقائق']:['أهلاً بعودتك.','تابع إدارة رسائل زبائنك بالذكاء الاصطناعي'];
let body='',btn='';
if(fg&&!cd){body=fld('email','email','mail','البريد الإلكتروني');btn='إرسال الرمز'}
else if(fg){body=fld('code','text','key','رمز التحقق')+fld('password','password','lock','كلمة المرور الجديدة');btn='تعيين كلمة المرور'}
else if(up&&cd){body=fld('code','text','key','رمز التحقق (6 أرقام)');btn='تأكيد وإنشاء الحساب'}
else if(up){body=fld('store_name','text','tag','اسم المتجر')+fld('email','email','mail','البريد الإلكتروني')+fld('password','password','lock','كلمة المرور (8 أحرف على الأقل)');btn='إنشاء الحساب'}
else{body=fld('email','email','mail','البريد الإلكتروني')+fld('password','password','lock','كلمة المرور')+'<div class="rw"><label class="ck"><input type="checkbox" name="remember" checked><i>'+ic('check',14)+'</i>تذكّر دخولي</label><a id="fgl">نسيت كلمة المرور؟</a></div>';btn='تسجيل الدخول'}
A.innerHTML=`<div class="au"><div class="ah">${logo(46,0,'a')}<div class="serif" style="font-size:22px;margin-top:8px">InstaPilot <span style="color:#60a5fa">AI</span></div><h1>${T[0]}</h1><p>${T[1]}</p>${!up&&!fg?'<div class="chips"><span>يفهم اللهجة العراقية</span><span>ردود من بياناتك فقط</span><span>تحكم كامل</span></div>':''}</div>
<div class="sheet">${fg?'':`<div class="seg"><button class="${up?'':'on'}" data-m="in">تسجيل الدخول</button><button class="${up?'on':''}" data-m="up">حساب جديد</button></div>`}
<form id="af" novalidate>${body}<div class="err" id="er"></div><button class="pb"><span>${btn}</span><i></i></button></form>
<p class="alt">${fg?'<a data-m="in">العودة لتسجيل الدخول</a>':up&&cd?'<a id="rs">إعادة إرسال الرمز</a>':'<a href="/privacy">الخصوصية</a> · <a href="/data-deletion">حذف البيانات</a>'}</p></div></div>`;
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;step=1;authView()});
const g=$('#fgl');if(g)g.onclick=()=>{mode='fg';step=1;authView()};
